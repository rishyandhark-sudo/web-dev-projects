<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureAuth — Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-mark">SA</span>
        <span class="logo-text">SecureAuth</span>
      </div>

      <!-- Heading -->
      <h1 class="auth-heading">Create account</h1>
      <p class="auth-subtitle">Join us today</p>

      <!-- Alert box for success / error messages -->
      <div id="signupAlert" class="alert-box" role="alert"></div>

      <!-- Signup form -->
      <form id="signupForm" class="auth-form" novalidate>

        <div class="form-group">
          <label for="signupName">Full name</label>
          <input
            type="text"
            id="signupName"
            name="fullName"
            placeholder="Your full name"
            autocomplete="name"
          />
          <span class="field-error" id="signupNameError"></span>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input
            type="email"
            id="signupEmail"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <span class="field-error" id="signupEmailError"></span>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="signupPassword"
              aria-label="Show password"
            >👁</button>
          </div>
          <span class="field-error" id="signupPasswordError"></span>

          <!-- Password strength meter -->
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar">
              <span id="strengthFill"></span>
            </div>
            <span class="strength-label" id="strengthLabel">Password strength: —</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
              aria-label="Show password"
            >👁</button>
          </div>
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="termsCheckbox" />
            <span>I agree to the Terms &amp; Conditions</span>
          </label>
        </div>

        <button type="submit" class="btn-primary">Create account</button>

        <p class="switch-text">
          Already have an account?
          <a href="index.html" class="link-accent">Login</a>
        </p>

      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
